# ==============================================================================
# PlayHub 一键部署
#
#   docker compose up -d --build
#
# 持久化内容（见 volumes 段）：
#   ./data/db         SQLite 数据库文件 playhub.db（含 -wal / -shm）
#                     —— 用户、播放记录、片源库都在这里，最重要
#   ./data/cache      源解析产物与各类缓存：
#                       jars/         下载的加固 jar
#                       unguard-jars/ unguard 还原后的 jar
#                       dex-jars/     内层 dex 转换产物
#                       bridge-jars/  桥接 jar
#                       config-cache/ 配置磁盘缓存
#                       js-runtime/   JS 爬虫运行时
#                     —— 保留它们可避免每次重启重新下载/转换（省时间也省流量）
#   ./logs            应用日志
#   ./android-cache   模拟 Android 的存储（SharedPreferences/外部存储/私有目录），
#                     部分爬虫会把登录态存在这里
#
# 首次启动会自动创建管理员账号，默认 admin / playhub（务必在 .env 或下方 environment 里改）。
# ==============================================================================

services:
  playhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: play:latest
    container_name: playhub
    restart: unless-stopped

    ports:
      - "${APP_PORT:-18080}:18080"

    environment:
      # ── 基础 ────────────────────────────────────────────
      APP_PORT: 18080
      TZ: ${TZ:-Asia/Shanghai}
      LANG: C.UTF-8

      # ── 管理员账号（仅首次启动生效，已存在则不会重置密码）──
      APP_ADMIN_ENABLED: ${APP_ADMIN_ENABLED:-true}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-playhub}

      # ── 持久化路径（与下方 volumes 一一对应）──────────────
      # 数据库单独一个文件，和缓存目录分开，方便备份/查看
      APP_DB_PATH: /opt/playhub/db/playhub.db
      APP_CACHE_DIR: /opt/playhub/data/cache
      APP_LOG_FILE: /opt/playhub/logs/playhub.log

      # ── JVM ─────────────────────────────────────────────
      # 小内存机器可调低 -Xmx；低于 512m 容器内存容易 OOM
      JAVA_OPTS: >-
        -Xms64m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/opt/playhub/logs/

      # ── 爬虫执行器 ──────────────────────────────────────
      APP_SPIDER_OPERATION_MAX_CONCURRENCY: ${APP_SPIDER_OPERATION_MAX_CONCURRENCY:-2}
      APP_SCRIPT_MAX_CONCURRENCY: ${APP_SCRIPT_MAX_CONCURRENCY:-2}
      DEX2JAR_COMMAND: __AUTO__
      NODE_COMMAND: node
      PYTHON_COMMAND: python3

      # ── 可选：跨站兜底桥（默认关闭，内容来自别的站）──────
      SPIDER_BRIDGE_URL: ${SPIDER_BRIDGE_URL:-}

    volumes:
      # ① 数据库：playhub.db（用户 / 播放记录 / 片源库）
      #    目录映射而非单文件映射 —— SQLite 运行时会生成 -wal / -shm 同级文件
      - ./data/db:/opt/playhub/db
      # ② 源解析产物与缓存：jars / unguard-jars / dex-jars / config-cache / js-runtime …
      #    保留后重启不必重新下载与转换加固包
      - ./data/cache:/opt/playhub/data/cache
      # ③ 日志
      - ./logs:/opt/playhub/logs
      # ④ 模拟 Android 存储（爬虫登录态 / 配置）
      - ./android-cache:/opt/playhub/.cache

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # 适当放宽容器的日志大小，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          # 与 JAVA_OPTS 的 -Xmx 配合使用；机器小可降到 768M
          memory: 1G
